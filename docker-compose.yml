services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: studymate-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: studymate-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped